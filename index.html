<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', 'Courier New', monospace;
            background: #0f0f23;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* CRT Scanline Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* Retro pixel pattern background */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    90deg,
                    rgba(138, 43, 226, 0.03) 0px,
                    transparent 1px,
                    transparent 2px,
                    rgba(138, 43, 226, 0.03) 3px
                ),
                repeating-linear-gradient(
                    0deg,
                    rgba(138, 43, 226, 0.03) 0px,
                    transparent 1px,
                    transparent 2px,
                    rgba(138, 43, 226, 0.03) 3px
                );
            pointer-events: none;
            z-index: 1;
        }

        .container {
            display: flex;
            gap: 40px;
            background: #1a1a2e;
            padding: 40px;
            border: 8px solid #8a2be2;
            box-shadow: 
                0 0 0 4px #0f0f23,
                0 0 0 8px #5a1f99,
                0 0 20px rgba(138, 43, 226, 0.5),
                inset 0 0 20px rgba(138, 43, 226, 0.1);
            max-width: 900px;
            position: relative;
            z-index: 10;
        }

        /* Arcade cabinet style corners */
        .container::before,
        .container::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 4px solid #00ff00;
        }

        .container::before {
            top: -4px;
            left: -4px;
            border-right: none;
            border-bottom: none;
        }

        .container::after {
            bottom: -4px;
            right: -4px;
            border-left: none;
            border-top: none;
        }

        .game-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .setup-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            background: #000000;
            border: 4px solid #00ff00;
            box-shadow: 
                0 0 0 2px #0f0f23,
                0 0 0 6px #00aa00,
                inset 0 0 10px rgba(0, 255, 0, 0.1);
        }

        .setup-section h2 {
            color: #00ff00;
            font-size: 12px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #006600;
            letter-spacing: 2px;
        }

        .setup-section input {
            padding: 12px;
            border: 4px solid #00ff00;
            background: #000000;
            color: #00ff00;
            font-size: 12px;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.2);
        }

        .setup-section input:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 
                inset 0 0 10px rgba(0, 255, 0, 0.3),
                0 0 10px rgba(0, 255, 0, 0.5);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 50% { border-color: #00ff00; }
            51%, 100% { border-color: #00aa00; }
        }

        .setup-section button {
            padding: 12px 24px;
            background: #8a2be2;
            color: #ffffff;
            border: 4px solid #5a1f99;
            font-size: 12px;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            cursor: pointer;
            box-shadow: 
                4px 4px 0 #3d1466,
                0 0 10px rgba(138, 43, 226, 0.5);
            text-transform: uppercase;
            position: relative;
            transition: none;
        }

        .setup-section button:hover {
            background: #9d4eed;
            box-shadow: 
                4px 4px 0 #3d1466,
                0 0 20px rgba(138, 43, 226, 0.8);
            transform: translate(1px, 1px);
        }

        .setup-section button:active {
            transform: translate(4px, 4px);
            box-shadow: 
                0 0 0 #3d1466,
                0 0 10px rgba(138, 43, 226, 0.5);
        }

        .board {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tile-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .tile {
            width: 60px;
            height: 60px;
            border: 4px solid #00ff00;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            background: #000000;
            color: #00ff00;
            box-shadow: 
                inset 2px 2px 0 rgba(0, 255, 0, 0.2),
                inset -2px -2px 0 rgba(0, 0, 0, 0.5),
                0 0 5px rgba(0, 255, 0, 0.3);
            position: relative;
        }

        /* Pixelated effect for tiles */
        .tile::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid rgba(0, 255, 0, 0.1);
            pointer-events: none;
        }

        .input-section {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .input-section input {
            padding: 12px 16px;
            border: 4px solid #00ff00;
            background: #000000;
            color: #00ff00;
            font-size: 12px;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            flex: 1;
            max-width: 200px;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.2);
        }

        .input-section input:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 
                inset 0 0 10px rgba(0, 255, 0, 0.3),
                0 0 10px rgba(0, 255, 0, 0.5);
        }

        .input-section button {
            padding: 12px 24px;
            background: #8a2be2;
            color: #ffffff;
            border: 4px solid #5a1f99;
            font-size: 12px;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            cursor: pointer;
            box-shadow: 
                4px 4px 0 #3d1466,
                0 0 10px rgba(138, 43, 226, 0.5);
            text-transform: uppercase;
            transition: none;
        }

        .input-section button:hover:not(:disabled) {
            background: #9d4eed;
            box-shadow: 
                4px 4px 0 #3d1466,
                0 0 20px rgba(138, 43, 226, 0.8);
            transform: translate(1px, 1px);
        }

        .input-section button:active:not(:disabled) {
            transform: translate(4px, 4px);
            box-shadow: 
                0 0 0 #3d1466,
                0 0 10px rgba(138, 43, 226, 0.5);
        }

        .input-section button:disabled {
            background: #333333;
            border-color: #1a1a1a;
            color: #666666;
            cursor: not-allowed;
            box-shadow: 
                4px 4px 0 #1a1a1a,
                0 0 5px rgba(0, 0, 0, 0.5);
        }

        .side-panel {
            width: 250px;
            background: #000000;
            padding: 20px;
            border: 4px solid #ffd700;
            box-shadow: 
                0 0 0 2px #0f0f23,
                0 0 0 6px #b8960a,
                inset 0 0 10px rgba(255, 215, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .side-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .side-section h3 {
            color: #ffd700;
            font-size: 10px;
            border-bottom: 4px solid #ffd700;
            padding-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #996600;
            letter-spacing: 2px;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .result-entry {
            padding: 8px;
            background: #1a1a2e;
            border: 2px solid #ffd700;
            font-size: 8px;
            color: #ffd700;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            box-shadow: inset 0 0 5px rgba(255, 215, 0, 0.1);
        }

        .result-entry strong {
            display: block;
            margin-bottom: 4px;
            color: #00ff00;
            text-shadow: 1px 1px 0 #006600;
        }

        .result-stats {
            font-size: 7px;
            letter-spacing: 1px;
        }

        .win-message {
            text-align: center;
            padding: 20px;
            background: #00ff00;
            color: #000000;
            border: 4px solid #00aa00;
            font-size: 12px;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            margin-top: 20px;
            box-shadow: 
                0 0 0 2px #000000,
                0 0 0 6px #006600,
                0 0 20px rgba(0, 255, 0, 0.8);
            text-transform: uppercase;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.3);
            animation: victory-pulse 0.5s step-end infinite;
        }

        @keyframes victory-pulse {
            0%, 50% { 
                box-shadow: 
                    0 0 0 2px #000000,
                    0 0 0 6px #006600,
                    0 0 20px rgba(0, 255, 0, 0.8);
            }
            51%, 100% { 
                box-shadow: 
                    0 0 0 2px #000000,
                    0 0 0 6px #006600,
                    0 0 30px rgba(0, 255, 0, 1);
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-section">
            <div class="setup-section" id="setupSection">
                <h2>Set Secret Word</h2>
                <input type="text" id="secretWordInput" placeholder="Enter a 4-7 letter word" maxlength="7">
                <button onclick="setSecretWord()">Set Word</button>
            </div>

            <div class="board" id="board" style="display: none;">
                <div class="tile-row" id="currentGuessRow"></div>
                <div class="input-section">
                    <input type="text" id="guessInput" placeholder="Enter your guess">
                    <button id="submitButton" onclick="submitGuess()">Submit</button>
                </div>
                <div id="winMessage" class="win-message hidden"></div>
            </div>
        </div>

        <div class="side-panel">
            <div class="side-section">
                <h3>Results</h3>
                <div class="results" id="resultPanel"></div>
            </div>
        </div>
    </div>

    <script>
        let secretWord = '';
        let guessCount = 0;
        let gameWon = false;

        function setSecretWord() {
            const input = document.getElementById('secretWordInput');
            const word = input.value.trim().toLowerCase();

            if (word.length < 4 || word.length > 7) {
                alert('Please enter a word between 4 and 7 letters');
                return;
            }

            secretWord = word;
            document.getElementById('setupSection').style.display = 'none';
            document.getElementById('board').style.display = 'flex';
            createInitialRow();
            document.getElementById('guessInput').focus();
        }

        function createInitialRow() {
            const row = document.getElementById('currentGuessRow');
            row.innerHTML = '';
            for (let i = 0; i < secretWord.length; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = '';
                row.appendChild(tile);
            }
        }

        function submitGuess() {
            if (gameWon) return;

            const input = document.getElementById('guessInput');
            const guess = input.value.trim().toLowerCase();

            if (guess.length !== secretWord.length) {
                alert(`Please enter a word with exactly ${secretWord.length} letters`);
                return;
            }

            guessCount++;
            const tiles = document.querySelectorAll('#currentGuessRow .tile');
            const guessArray = guess.split('');

            let fullRight = 0;
            let halfRight = 0;
            const secretArray = secretWord.split('');

            // First pass: mark full right
            for (let i = 0; i < guessArray.length; i++) {
                if (guessArray[i] === secretArray[i]) {
                    fullRight++;
                    tiles[i].textContent = guessArray[i].toUpperCase();
                    secretArray[i] = null;
                    guessArray[i] = null;
                }
            }

            // Second pass: mark half right
            for (let i = 0; i < guessArray.length; i++) {
                if (guessArray[i] !== null) {
                    const index = secretArray.indexOf(guessArray[i]);
                    if (index !== -1) {
                        halfRight++;
                        tiles[i].textContent = guessArray[i].toUpperCase();
                        secretArray[index] = null;
                    } else {
                        tiles[i].textContent = guessArray[i].toUpperCase();
                    }
                }
            }

            // Add result to side panel
            addResultEntry(guessCount, halfRight, fullRight);

            // Check for win
            if (guess === secretWord) {
                gameWon = true;
                document.getElementById('winMessage').textContent = 'Correct! You win!';
                document.getElementById('winMessage').classList.remove('hidden');
                document.getElementById('guessInput').disabled = true;
                document.getElementById('submitButton').disabled = true;
            } else {
                // Create new row for next guess
                const newRow = document.createElement('div');
                newRow.className = 'tile-row';
                for (let i = 0; i < secretWord.length; i++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.textContent = '';
                    newRow.appendChild(tile);
                }
                document.getElementById('board').insertBefore(newRow, document.querySelector('.input-section'));
                document.getElementById('currentGuessRow').id = '';
                newRow.id = 'currentGuessRow';
            }

            input.value = '';
            input.focus();
        }

        function addResultEntry(guessNumber, halfRight, fullRight) {
            const resultPanel = document.getElementById('resultPanel');
            const entry = document.createElement('div');
            entry.className = 'result-entry';
            entry.innerHTML = `
                <strong>Guess ${guessNumber}:</strong>
                <div class="result-stats">Half right: ${halfRight} | Full right: ${fullRight}</div>
            `;
            resultPanel.appendChild(entry);
        }

        // Allow Enter key to submit
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('secretWordInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') setSecretWord();
            });
        });

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && document.getElementById('board').style.display !== 'none' && !gameWon) {
                submitGuess();
            }
        });
    </script>
</body>
</html>
